name: Automated Vercel Production Deployment

on:
  push:
    branches:
      - main
      - master # Tự động chạy khi bạn push code vào nhánh main hoặc master

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    steps:
      # 1. Tải toàn bộ mã nguồn từ GitHub xuống máy ảo
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Cài đặt NodeJS để sử dụng công cụ Vercel CLI
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Cài đặt Vercel CLI bản mới nhất toàn hệ thống
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 4. Thực hiện đẩy thẳng code lên môi trường Live (Production) của Vercel
      # Lệnh này sẽ đẩy code lên và để Vercel tự cài requirements.txt thông qua vercel.json
      - name: Deploy Direct to Vercel Production
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
