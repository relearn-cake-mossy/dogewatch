<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YTView — Xem YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f0f0f;
    --surface:  #1a1a1a;
    --surface2: #252525;
    --border:   #2e2e2e;
    --red:      #ff0000;
    --red-dim:  #cc0000;
    --text:     #f1f1f1;
    --muted:    #aaaaaa;
    --dim:      #717171;
    --radius:   10px;
    --sidebar:  340px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

  /* ─── TOPBAR ─── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 56px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none;
    flex-shrink: 0;
  }
  .logo svg { color: var(--red); }

  .search-form {
    flex: 1; max-width: 640px; margin: 0 auto;
    display: flex; gap: 0;
  }
  .search-input {
    flex: 1;
    background: var(--surface); border: 1px solid var(--border);
    border-right: none; border-radius: var(--radius) 0 0 var(--radius);
    color: var(--text); font-size: 14px; font-family: inherit;
    padding: 8px 16px; outline: none;
    transition: border-color .15s;
  }
  .search-input:focus { border-color: #555; }
  .search-input::placeholder { color: var(--dim); }
  .search-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-left: none; border-radius: 0 var(--radius) var(--radius) 0;
    padding: 8px 18px; cursor: pointer; color: var(--text);
    font-size: 16px; transition: background .15s;
  }
  .search-btn:hover { background: #333; }

  /* ─── LAYOUT ─── */
  .main {
    display: flex; height: 100vh; padding-top: 56px;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar); flex-shrink: 0;
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sidebar-header {
    padding: 8px 16px 12px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    color: var(--dim); text-transform: uppercase;
  }

  /* ─── VIDEO CARD ─── */
  .video-card {
    display: flex; gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
    margin: 0 6px;
    transition: background .12s;
    position: relative;
  }
  .video-card:hover { background: var(--surface); }
  .video-card.active { background: var(--surface2); }

  .card-thumb {
    position: relative; flex-shrink: 0;
    width: 120px; height: 68px; border-radius: 6px; overflow: hidden;
    background: var(--surface2);
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-duration {
    position: absolute; bottom: 4px; right: 4px;
    background: rgba(0,0,0,.85); color: #fff;
    font-size: 10px; font-weight: 600;
    padding: 1px 4px; border-radius: 3px;
  }

  .card-info { flex: 1; min-width: 0; }
  .card-title {
    font-size: 13px; font-weight: 500; line-height: 1.35;
    color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta { font-size: 11px; color: var(--dim); margin-top: 4px; }

  /* ─── PLAYER AREA ─── */
  .player-area {
    flex: 1; overflow-y: auto; padding: 20px 28px;
  }
  .player-area::-webkit-scrollbar { width: 4px; }
  .player-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ─── EMPTY / HERO ─── */
  .hero {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: calc(100vh - 56px - 40px);
    gap: 16px; text-align: center;
  }
  .hero-icon { font-size: 64px; opacity: .15; }
  .hero-title { font-size: 22px; font-weight: 600; color: var(--muted); }
  .hero-sub { font-size: 14px; color: var(--dim); }

  /* ─── VIDEO PLAYER ─── */
  .player-wrapper {
    width: 100%; max-width: 900px;
  }
  .video-container {
    position: relative; width: 100%; padding-bottom: 56.25%;
    background: #000; border-radius: var(--radius); overflow: hidden;
  }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: #000; outline: none;
  }

  .player-meta { margin-top: 16px; }
  .player-title { font-size: 18px; font-weight: 600; line-height: 1.4; }

  .player-stats {
    display: flex; align-items: center; gap: 16px;
    margin-top: 10px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .stat-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
  }
  .stat-badge svg { opacity: .6; }

  .channel-row {
    display: flex; align-items: center; gap: 10px; margin-top: 14px;
  }
  .channel-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--red); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .channel-name { font-size: 14px; font-weight: 500; }

  .quality-row {
    margin-top: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .quality-label { font-size: 12px; color: var(--dim); }
  .quality-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 4px 12px;
    border-radius: 20px; cursor: pointer; transition: all .15s;
    font-family: inherit;
  }
  .quality-btn:hover, .quality-btn.active { background: var(--red); border-color: var(--red); }

  .player-desc {
    margin-top: 16px; font-size: 13px; line-height: 1.6; color: var(--muted);
    background: var(--surface); padding: 14px 16px; border-radius: var(--radius);
    white-space: pre-wrap;
  }

  /* ─── LOADING ─── */
  .loader {
    display: none; justify-content: center; align-items: center;
    gap: 8px; padding: 32px 0; color: var(--dim); font-size: 14px;
  }
  .loader.show { display: flex; }
  .spinner {
    width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--red); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── ERROR ─── */
  .error-box {
    background: rgba(255,0,0,.08); border: 1px solid rgba(255,0,0,.2);
    color: #ff6b6b; border-radius: var(--radius);
    padding: 14px 16px; font-size: 13px; margin: 16px 0;
    display: none;
  }
  .error-box.show { display: block; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    :root { --sidebar: 100%; }
    .main { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    .player-area { padding: 12px; }
    .search-form { max-width: none; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a class="logo" href="/">
    <svg width="28" height="20" viewBox="0 0 28 20" fill="currentColor">
      <rect width="28" height="20" rx="5"/>
      <polygon points="11,5 11,15 20,10" fill="#0f0f0f"/>
    </svg>
    YTView
  </a>

  <form class="search-form" id="searchForm">
    <input class="search-input" type="text" id="searchInput"
           placeholder="Tìm kiếm video..." autocomplete="off" />
    <button class="search-btn" type="submit">🔍</button>
  </form>
</header>

<!-- MAIN -->
<div class="main">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarHeader">Kết quả tìm kiếm</div>
    <div class="loader" id="searchLoader"><div class="spinner"></div>Đang tìm...</div>
    <div class="error-box" id="searchError"></div>
    <div id="resultsList"></div>
  </aside>

  <!-- PLAYER -->
  <main class="player-area" id="playerArea">
    <div class="hero" id="hero">
      <div class="hero-icon">▶</div>
      <div class="hero-title">Tìm và xem YouTube</div>
      <div class="hero-sub">Nhập từ khoá vào ô tìm kiếm để bắt đầu</div>
    </div>

    <div class="player-wrapper" id="playerWrapper" style="display:none">
      <div class="video-container">
        <video id="videoPlayer" controls autoplay playsinline></video>
      </div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle"></div>
        <div class="player-stats">
          <span class="stat-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="playerViews">—</span>
          </span>
          <span class="stat-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="playerLikes">—</span> lượt thích
          </span>
          <span class="stat-badge">⏱ <span id="playerDuration">—</span></span>
        </div>
        <div class="channel-row">
          <div class="channel-avatar" id="channelAvatar">?</div>
          <div class="channel-name" id="playerChannel"></div>
        </div>
        <div class="quality-row">
          <span class="quality-label">Chất lượng:</span>
          <button class="quality-btn active" data-q="best" onclick="changeQuality(this)">Tốt nhất</button>
          <button class="quality-btn" data-q="1080p" onclick="changeQuality(this)">1080p</button>
          <button class="quality-btn" data-q="720p" onclick="changeQuality(this)">720p</button>
          <button class="quality-btn" data-q="480p" onclick="changeQuality(this)">480p</button>
          <button class="quality-btn" data-q="360p" onclick="changeQuality(this)">360p</button>
          <button class="quality-btn" data-q="audio" onclick="changeQuality(this)">🎵 Audio</button>
        </div>
        <div class="loader" id="playerLoader" style="margin-top:10px"><div class="spinner"></div>Đang tải stream...</div>
        <div class="error-box" id="playerError"></div>
        <div class="player-desc" id="playerDesc" style="display:none"></div>
      </div>
    </div>
  </main>

</div>

<script>
  let currentVideoId = null;
  let currentQuality = 'best';

  // ── Search ──────────────────────────────────────────────────────────────────
  document.getElementById('searchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    await doSearch(q);
  });

  async function doSearch(query) {
    setSearchLoading(true);
    clearSearchError();
    document.getElementById('resultsList').innerHTML = '';
    document.getElementById('sidebarHeader').textContent = `Kết quả: "${query}"`;

    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderResults(data.results || []);
    } catch (err) {
      showSearchError('Lỗi tìm kiếm: ' + err.message);
    } finally {
      setSearchLoading(false);
    }
  }

  function renderResults(videos) {
    const list = document.getElementById('resultsList');
    if (!videos.length) {
      list.innerHTML = '<div style="padding:20px 16px;color:var(--dim);font-size:13px">Không tìm thấy kết quả.</div>';
      return;
    }
    list.innerHTML = videos.map(v => `
      <div class="video-card" id="card-${v.id}" onclick="loadVideo('${v.id}')">
        <div class="card-thumb">
          <img src="${v.thumbnail}" alt="" loading="lazy"
               onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'" />
          <span class="card-duration">${v.duration}</span>
        </div>
        <div class="card-info">
          <div class="card-title">${escHtml(v.title)}</div>
          <div class="card-meta">${escHtml(v.channel)} · ${v.views} lượt xem</div>
        </div>
      </div>
    `).join('');
  }

  // ── Load Video ───────────────────────────────────────────────────────────────
  async function loadVideo(videoId) {
    currentVideoId = videoId;

    // Mark active card
    document.querySelectorAll('.video-card').forEach(c => c.classList.remove('active'));
    const card = document.getElementById('card-' + videoId);
    if (card) { card.classList.add('active'); card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

    // Show player skeleton
    document.getElementById('hero').style.display = 'none';
    document.getElementById('playerWrapper').style.display = 'block';
    document.getElementById('playerTitle').textContent = 'Đang tải...';
    document.getElementById('playerDesc').style.display = 'none';

    // Fetch video metadata
    try {
      const res = await fetch(`/api/video?id=${videoId}`);
      const info = await res.json();
      if (info.error) throw new Error(info.error);

      document.getElementById('playerTitle').textContent = info.title;
      document.getElementById('playerViews').textContent = info.views + ' lượt xem';
      document.getElementById('playerLikes').textContent = info.likes;
      document.getElementById('playerDuration').textContent = info.duration;
      document.getElementById('playerChannel').textContent = info.channel;
      document.getElementById('channelAvatar').textContent = (info.channel || '?')[0].toUpperCase();

      if (info.description) {
        document.getElementById('playerDesc').textContent = info.description;
        document.getElementById('playerDesc').style.display = 'block';
      }

      // Update URL
      window.history.pushState({}, '', `/watch?v=${videoId}`);
    } catch (err) {
      // Non-fatal, still try to play
      console.warn('Meta error:', err.message);
    }

    // Load stream
    await loadStream(videoId, currentQuality);
  }

  async function loadStream(videoId, quality) {
    const loader = document.getElementById('playerLoader');
    const errBox = document.getElementById('playerError');
    const player = document.getElementById('videoPlayer');

    loader.classList.add('show');
    errBox.classList.remove('show');

    try {
      const res = await fetch(`/api/stream?id=${videoId}&quality=${quality}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const src = data.stream_url || data.direct_url;
      if (!src) throw new Error('Không lấy được đường dẫn stream');

      player.src = src;
      player.load();
      player.play().catch(() => {}); // autoplay might be blocked
    } catch (err) {
      errBox.textContent = '⚠ Không thể phát video: ' + err.message;
      errBox.classList.add('show');
    } finally {
      loader.classList.remove('show');
    }
  }

  function changeQuality(btn) {
    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentQuality = btn.dataset.q;
    if (currentVideoId) {
      const currentTime = document.getElementById('videoPlayer').currentTime;
      loadStream(currentVideoId, currentQuality).then(() => {
        document.getElementById('videoPlayer').currentTime = currentTime;
      });
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function setSearchLoading(on) {
    document.getElementById('searchLoader').classList.toggle('show', on);
  }
  function clearSearchError() {
    const e = document.getElementById('searchError');
    e.classList.remove('show'); e.textContent = '';
  }
  function showSearchError(msg) {
    const e = document.getElementById('searchError');
    e.textContent = msg; e.classList.add('show');
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Auto-load from URL ────────────────────────────────────────────────────────
  const initVideoId = "{{ video_id | default('') }}";
  if (initVideoId) loadVideo(initVideoId);
</script>
</body>
</html>
